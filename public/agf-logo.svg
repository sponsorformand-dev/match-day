<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Subtle drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Dark Navy Roundel -->
  <circle cx="160" cy="160" r="154" fill="#081326" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="160" cy="160" r="144" fill="none" stroke="#C8102E" stroke-width="3"/>
  <circle cx="160" cy="160" r="138" fill="#FFFFFF"/>

  <!-- Inner Crest Shield -->
  <path d="M96,75 L224,75 C224,75 224,170 160,225 C96,170 96,75 96,75 Z" fill="#081326"/>

  <!-- Aarhus Three Towers Silhouette in White -->
  <!-- Center main tower -->
  <rect x="146" y="105" width="28" height="60" fill="#FFFFFF"/>
  <polygon points="142,105 160,85 178,105" fill="#FFFFFF"/>
  <rect x="156" y="130" width="8" height="15" rx="4" fill="#081326"/>

  <!-- Left tower -->
  <rect x="118" y="120" width="22" height="45" fill="#FFFFFF"/>
  <polygon points="115,120 129,105 143,120" fill="#FFFFFF"/>
  <rect x="125" y="140" width="8" height="12" rx="4" fill="#081326"/>

  <!-- Right tower -->
  <rect x="180" y="120" width="22" height="45" fill="#FFFFFF"/>
  <polygon points="177,120 191,105 205,120" fill="#FFFFFF"/>
  <rect x="187" y="140" width="8" height="12" rx="4" fill="#081326"/>

  <!-- Waves of Aarhus Bay -->
  <path d="M112,176 Q136,170 160,176 Q184,182 208,176 L208,188 Q184,194 160,188 Q136,182 112,188 Z" fill="#C8102E"/>
  <path d="M116,192 Q138,187 160,192 Q182,197 204,192 L204,200 Q182,205 160,200 Q138,195 116,200 Z" fill="#FFFFFF"/>

  <!-- Prominent AGF Letters across Top -->
  <text x="160" y="62" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="34" fill="#081326" text-anchor="middle" letter-spacing="4">A G F</text>

  <!-- 1880 Foundation Year -->
  <text x="160" y="254" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="16" fill="#081326" text-anchor="middle" letter-spacing="3">1880</text>

  <!-- Red Accent Ribbons with Motto / Sport -->
  <path d="M60,268 L260,268 L250,296 L70,296 Z" fill="#081326"/>
  <rect x="68" y="271" width="184" height="2" fill="#C8102E"/>
  <text x="160" y="289" font-family="'Teko', 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">HÅNDBOLD</text>
</svg>
